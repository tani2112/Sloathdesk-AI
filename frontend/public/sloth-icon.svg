<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c59b6d" />
      <stop offset="100%" stop-color="#633d18" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="goldGlasses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background circle - Jet Black with Gold Rim -->
  <circle cx="50" cy="50" r="48" fill="#09090b" stroke="#facc15" stroke-width="3" />
  
  <!-- Sloth Head -->
  <circle cx="50" cy="50" r="32" fill="url(#furGrad)" />
  
  <!-- Face mask -->
  <ellipse cx="50" cy="52" rx="24" ry="20" fill="url(#faceGrad)" />
  
  <!-- Eye patches -->
  <path d="M 33,44 C 30,46 27,53 32,56 C 37,58 41,52 38,46 Z" fill="#451a03" />
  <path d="M 67,44 C 70,46 73,53 68,56 C 63,58 59,52 62,46 Z" fill="#451a03" />
  
  <!-- Sleeping / Content Sloth Eyes -->
  <path d="M 32,50 Q 35,54 38,50" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 62,50 Q 65,54 68,50" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Golden Glasses -->
  <circle cx="35" cy="50" r="8" fill="none" stroke="url(#goldGlasses)" stroke-width="2.2" />
  <circle cx="65" cy="50" r="8" fill="none" stroke="url(#goldGlasses)" stroke-width="2.2" />
  <line x1="43" y1="50" x2="57" y2="50" stroke="url(#goldGlasses)" stroke-width="2.2" />
  
  <!-- Snout & Nose -->
  <ellipse cx="50" cy="58" rx="5" ry="3.5" fill="#1c1917" />
  <!-- Gentle Smile -->
  <path d="M 46,63 Q 50,66 54,63" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" />
  
  <!-- Little cute gold leaf on head -->
  <path d="M 50,22 Q 58,15 62,22 Q 54,26 50,22 Z" fill="#facc15" />
  <line x1="50" y1="22" x2="56" y2="20" stroke="#ca8a04" stroke-width="1.5" />
</svg>
