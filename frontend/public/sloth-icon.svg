<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b08968" />
      <stop offset="100%" stop-color="#7f5539" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faedcd" />
      <stop offset="100%" stop-color="#e9edc9" />
    </linearGradient>
    <linearGradient id="eyePatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c6644" />
      <stop offset="100%" stop-color="#7f4f24" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#151b28" stroke="#a855f7" stroke-width="3" />
  
  <!-- Sloth Head -->
  <circle cx="50" cy="50" r="32" fill="url(#furGrad)" />
  
  <!-- Face mask -->
  <ellipse cx="50" cy="52" rx="24" ry="20" fill="url(#faceGrad)" />
  
  <!-- Eye patches -->
  <path d="M 33,44 C 30,46 27,53 32,56 C 37,58 41,52 38,46 Z" fill="url(#eyePatch)" />
  <path d="M 67,44 C 70,46 73,53 68,56 C 63,58 59,52 62,46 Z" fill="url(#eyePatch)" />
  
  <!-- Sleeping / Content Sloth Eyes (curved lines) -->
  <path d="M 32,50 Q 35,54 38,50" fill="none" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 62,50 Q 65,54 68,50" fill="none" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Cute Glasses -->
  <circle cx="35" cy="50" r="8" fill="none" stroke="#c084fc" stroke-width="2" />
  <circle cx="65" cy="50" r="8" fill="none" stroke="#c084fc" stroke-width="2" />
  <line x1="43" y1="50" x2="57" y2="50" stroke="#c084fc" stroke-width="2" />
  
  <!-- Snout & Nose -->
  <ellipse cx="50" cy="58" rx="5" ry="3.5" fill="#2b2d42" />
  <!-- Gentle Smile -->
  <path d="M 46,63 Q 50,66 54,63" fill="none" stroke="#2b2d42" stroke-width="2" stroke-linecap="round" />
  
  <!-- Little cute leaf on head -->
  <path d="M 50,22 Q 58,15 62,22 Q 54,26 50,22 Z" fill="#14b8a6" />
  <line x1="50" y1="22" x2="56" y2="20" stroke="#0f766e" stroke-width="1.5" />
</svg>
